name: Test

# Added round-3 independent review, finding T-1: this app's own Vitest
# suite (added the same session as this workflow - see PROJECT_STATUS.md
# §92) had no CI running it at all, and its own `npm test` was watch-mode
# by default (never terminated non-interactively) until this same pass
# fixed it to `vitest run`.
#
# 2026-09-13: moved from a GitHub-hosted runner to a dedicated self-hosted
# Mac runner (`laster-console`) to cut GitHub Actions minutes - the org
# hit ~98% of its included 2,000 monthly minutes in September 2026. This
# app has no Playwright e2e suite (only ad hoc manual smoke tests, never
# checked in) and no build step needing Apple Silicon, so a hosted runner
# was originally the simpler, lower-privilege choice here - `laster`
# (casazium/license's own runner) is registered to that repo only, so
# this needed its own separate instance, `laster-console`, in
# `~/actions-runner-console` on the same Mac. Same deliberate trade-off
# as casazium/license's test.yml: this job runs on pull_request, and a
# self-hosted runner executes workflow code directly on real hardware
# with no sandbox - anyone with push/PR access to this repo can now run
# code on the operator's Mac. Accepted because casazium/license-console
# is private (no public-fork PR exposure) and single-operator today;
# revisit if that ever changes (e.g. outside collaborators added).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels that PR's still-running CI: only the latest
# commit's result matters, and the org's included Actions minutes are
# finite (2026-09-13, 90% used). Pushes to main get a unique group
# (run_id), so they are never cancelled or dropped from the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # Standalone/mock mode (no LICENSE_API_URL/LICENSE_ADMIN_API_KEY
        # set) - see lib/license-client.ts's getBackendMode(). Confirms
        # the app actually compiles and every route (including the new
        # /releases ones) is reachable at build time, without needing a
        # real casazium/license backend or any secrets in this job.
        run: npm run build
