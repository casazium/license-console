# Coolify deployment - a separate resource from casazium/license's own
# docker-compose-coolify.yml (see PROJECT_STATUS.md §14: two independently
# deployable Coolify resources, not one combined stack). Routing/TLS via
# Coolify's own per-service Domain configuration, not hand-authored Traefik
# routers here - same convention as casazium/casazium's
# docker-compose-coolify.yml. No custom Traefik service/router label is
# needed here - Coolify resolves the port from `expose:` alone (confirmed
# 2026-08-06; see the labels: block below for why a hardcoded label was
# tried here and removed).
#
# Required env vars (set via Coolify's environment variables UI for this
# service, not committed anywhere): SESSION_SECRET, ADMIN_UI_USERNAME,
# ADMIN_UI_PASSWORD, PUBLIC_BASE_URL (security review finding H2 -
# lib/config.ts's publicBaseUrl() fails loud at request time if this is
# unset in production; every emailed link and email-triggered redirect
# would otherwise silently point at this container's own internal
# HOSTNAME:PORT, unreachable from outside - set it to this service's own
# real Coolify Domain, e.g. https://console.example.com).
#
# EMAIL_PROVIDER (fresh pre-deployment audit finding): required for a
# real MULTI_TENANT=true deployment - lib/email/index.ts's
# getEmailProvider() now fails loud at request time if this is unset in
# production multi-tenant mode, for the same reason as PUBLIC_BASE_URL
# above. This var was previously missing from this file entirely, which
# meant a real deploy silently ran the stub email provider: password
# reset and signup confirmation never sent real mail, and the real
# reset/confirm link was instead logged in plaintext to this container's
# own logs - a real account-takeover risk for anyone with log access,
# not just a UX bug. Set EMAIL_PROVIDER=resend plus RESEND_API_KEY (and
# optionally EMAIL_FROM) for real delivery. TRUSTED_PROXY_COUNT
# (security review finding H1) is optional - defaults to 1, correct for
# this file's own single-Traefik-hop topology; only needed if that ever
# changes.
#
# For a *live* deployment (connected to a real backend,
# not standalone/mock mode), also set LICENSE_API_URL (the license
# backend's own Coolify Domain, including /v1, e.g.
# https://license-api.example.com/v1) and LICENSE_ADMIN_API_KEY (must
# match that backend service's own ADMIN_API_KEY). For a standalone/mock
# deployment instead, leave both of those unset AND set
# LICENSE_STANDALONE_MODE=true to confirm that's intentional - in
# production, both-unset without that flag is treated as a
# misconfiguration rather than a silent fallback to demo data, see
# lib/license-client.ts's getBackendMode(). BRANDING_* vars are all
# optional either way.
#
# BRANDING_TITLE_HTML and BRANDING_COLOR specifically: enable Coolify's
# per-variable "Is Literal" checkbox for both (confirmed - without it,
# Coolify reprocesses the value before injecting it, which corrupted both
# in testing; see .env.example's BRANDING_COLOR note for the quoting angle
# of that same failure mode).
#
# console-data volume (SaaS-B1a): persists this console's own SQLite DB
# (accounts, sessions - lib/db.ts) across redeploys, same pattern as
# casazium/license's own license-data volume. Confirm in the Coolify UI
# that this is recognized as persistent storage for this service, not
# discarded on rebuild.
#
# MULTI_TENANT / ACCOUNT_ENCRYPTION_KEY (SaaS-C1): both optional,
# unset/false for a self-hosted deployment - leave them out of this
# service's Coolify env vars entirely for that case, same behavior as
# today. A SaaS-tier deployment is a SEPARATE Coolify resource from this
# same repo/compose file, with its own Domain, pointed at a SEPARATE
# MULTI_TENANT=true casazium/license resource (not the self-hosted one) -
# LICENSE_API_URL/LICENSE_ADMIN_API_KEY above must match that SaaS
# server resource specifically. See DEPLOYMENT.md.
#
# Backups (beta-readiness finding): scripts/backup-db.mjs takes a
# WAL-safe, integrity-checked snapshot of DB_FILE (this console's own
# accounts/sessions DB - the *only* copy of every hosted tenant's
# encrypted casazium/license API key) into BACKUP_DIR, a SEPARATE volume
# from console-data below - same reasoning as casazium/license's own
# docker-compose-coolify.yml, and just as load-bearing here, since losing
# this DB strands every tenant's licenses on that server with no way back
# in. Schedule it via Coolify's own Scheduled Task feature for this
# service (confirm the exact UI path/name for your Coolify version): a
# daily `node scripts/backup-db.mjs` run inside this container. See that
# other file's own comment for why an off-box push is still a separate,
# manual step this compose file doesn't set up. See DEPLOYMENT.md's
# Backups section for the restore procedure.
services:
  console:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      # Not operator-configurable like the vars below - Docker auto-sets
      # HOSTNAME to the container's own short ID, which the standalone
      # server (.next/standalone/server.js) picks up ahead of its own
      # `|| '0.0.0.0'` fallback, binding to that hostname instead of all
      # interfaces (see the matching ENV HOSTNAME=0.0.0.0 in Dockerfile,
      # which this reinforces in case Coolify's own env injection ever
      # takes precedence over the image-baked value).
      - HOSTNAME=0.0.0.0
      - DB_FILE=/app/data/console.db
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - MULTI_TENANT=${MULTI_TENANT}
      - ACCOUNT_ENCRYPTION_KEY=${ACCOUNT_ENCRYPTION_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_UI_USERNAME=${ADMIN_UI_USERNAME}
      - ADMIN_UI_PASSWORD=${ADMIN_UI_PASSWORD}
      - LICENSE_API_URL=${LICENSE_API_URL}
      - LICENSE_ADMIN_API_KEY=${LICENSE_ADMIN_API_KEY}
      - LICENSE_STANDALONE_MODE=${LICENSE_STANDALONE_MODE}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT}
      - BRANDING_LOGO_URL=${BRANDING_LOGO_URL}
      - BRANDING_TITLE_HTML=${BRANDING_TITLE_HTML}
      - BRANDING_COLOR=${BRANDING_COLOR}
      - BRANDING_COPYRIGHT_HOLDER=${BRANDING_COPYRIGHT_HOLDER}
      - BRANDING_FAVICON_URL=${BRANDING_FAVICON_URL}
      - BACKUP_DIR=/app/backups
    volumes:
      - console-data:/app/data
      # Backup destination - a separate volume from console-data above on
      # purpose, see this file's own header comment on Backups.
      - console-backups:/app/backups
    labels:
      - traefik.enable=true

      # No custom traefik.http.services/middlewares labels here,
      # deliberately (confirmed 2026-08-06, same finding as
      # casazium/license's own docker-compose-coolify.yml - see that file's
      # labels: block and its PROJECT_STATUS.md §67 for the full writeup).
      # This file is built verbatim by every Coolify resource that runs
      # this console - both the standalone instance and SaaS-C1 - so a
      # hardcoded label name here would be shared by both. Coolify doesn't
      # interpolate ${VAR} inside labels: (confirmed, see
      # casazium/casazium's CLAUDE.md), so that name can't be made unique
      # per resource. A previous version of this file declared
      # traefik.http.services.license-console-svc.loadbalancer.server.port=3000
      # and a matching middleware label; since both resources registered
      # the same service name, deploying either one silently redirected
      # the OTHER resource's domain to whichever container had registered
      # most recently - confirmed live between license.casazium.com and
      # license-cloud.casazium.com (both login pages intermittently
      # serving the wrong instance, tracking deploy order rather than
      # domain). Removing the label entirely fixed it: Coolify's
      # Domain-based routing resolves the port from `expose:` alone just
      # fine, giving each resource its own uniquely-scoped backend instead
      # of a shared literal name. Do not reintroduce a hardcoded
      # traefik.http.services.<name> label here without giving it a value
      # that's actually unique per resource.

    healthcheck:
      # node, not wget/curl - guaranteed present (it's the runtime) rather
      # than relying on an Alpine base image's busybox tools.
      #
      # /api/health/db (route.ts), not /login - /login never touched the
      # database, so a locked/corrupted DB previously still reported
      # healthy here (BETA_LAUNCH_STATUS.md §4). /api/health/db runs a
      # real query and returns 503 on failure.
      test:
        [
          'CMD-SHELL',
          "node -e \"require('http').get('http://127.0.0.1:3000/api/health/db', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  console-data:
  console-backups:
